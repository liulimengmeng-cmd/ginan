name: R19 evidence bridge

on:
  push:
    branches:
      - chatgpt/r19-evidence-bridge-20260831
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and validate release asset
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/liulimengmeng-cmd/ginan/releases/download/zhang-r19-evidence-20260831/ZHANG_R19_EVIDENCE_V2_REUPLOAD.zip'
          EXPECTED='5b78d69d7e46e147daad1774ae27076d65d91b89e5cc73476ff23c4d4048bc59'
          curl -L --fail --retry 3 --retry-all-errors -o ZHANG_R19_EVIDENCE_V2_REUPLOAD.zip "$URL"
          stat -c 'size=%s' ZHANG_R19_EVIDENCE_V2_REUPLOAD.zip | tee external_size.txt
          printf '%s  %s\n' "$EXPECTED" ZHANG_R19_EVIDENCE_V2_REUPLOAD.zip | tee external_sha256.expected
          sha256sum ZHANG_R19_EVIDENCE_V2_REUPLOAD.zip | tee external_sha256.actual
          sha256sum -c external_sha256.expected
          mkdir extracted
          unzip -q ZHANG_R19_EVIDENCE_V2_REUPLOAD.zip -d extracted
          find extracted -type f -printf '%P\t%s\n' | sort > inventory.tsv
          MANIFEST=$(find extracted -type f \( -name 'SHA256SUMS' -o -name 'SHA256SUMS.txt' \) | head -n 1)
          test -n "$MANIFEST"
          MANIFEST_DIR=$(dirname "$MANIFEST")
          MANIFEST_NAME=$(basename "$MANIFEST")
          (cd "$MANIFEST_DIR" && sha256sum -c "$MANIFEST_NAME") | tee internal_sha256.log
          printf 'manifest=%s\n' "$MANIFEST" > manifest_location.txt
      - name: Upload verified evidence
        uses: actions/upload-artifact@v4
        with:
          name: r19-evidence-verified
          path: |
            ZHANG_R19_EVIDENCE_V2_REUPLOAD.zip
            external_size.txt
            external_sha256.expected
            external_sha256.actual
            internal_sha256.log
            inventory.tsv
            manifest_location.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
