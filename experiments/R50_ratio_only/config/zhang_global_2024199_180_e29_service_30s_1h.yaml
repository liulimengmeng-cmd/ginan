# Apply after zhang_global_2024199_180_e29_180network_product_1h.yaml.
# It preserves the E29 mathematics and changes only cadence/output identity.
processing_options:
  epoch_control:
    start_epoch: 2024-07-17 00:00:00
    end_epoch: 2024-07-17 01:00:00
    epoch_interval: 30
    wait_next_epoch: 3600
  gnss_general:
    zhang_pppar:
      integer_strategy: LAYERED_WL_L1
      # Keep the dedicated E29 shadow audits enabled by the preceding overlay,
      # but suppress per-coordinate trace flooding at 180-station scale.
      output_products: true
      user_adapter: false
      product_mode: HOU_OSB_LIKE
      hou_product_coordinate: PRODUCT_TREE
      output_diagnostics: false
      product_filename: ./outputs/zhang_global_2024199_180_e29_service_30s_1h/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2024199_180_e29_service_30s_1h/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2024199_180_e29_service_30s_1h
  metadata:
    config_description: zhang_global_2024199_180_e29_service_30s_1h
