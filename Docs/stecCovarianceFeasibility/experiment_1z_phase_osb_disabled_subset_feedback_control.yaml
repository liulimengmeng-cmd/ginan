# Negative control: candidates may still exist statistically, but the hard
# product gate must reject every feedback attempt when satellite phase OSBs are
# disabled.  Any submitted pseudo-observation is a test failure.
inputs:
  include_yamls:
    - Docs/stecCovarianceFeasibility/experiment_1_receiver_sd_ar.yaml

outputs:
  metadata:
    config_description: exp1z_2024_phase_osb_disabled_subset_feedback_control

satellite_options:
  global:
    models:
      phase_bias:
        enable: false

processing_options:
  ambiguity_resolution:
    integer_complement_diagnostics: true
    dual_frequency_subset_feedback: true
    canonicalize_phase_windup_integer: true

  epoch_control:
    max_epochs: 2880
