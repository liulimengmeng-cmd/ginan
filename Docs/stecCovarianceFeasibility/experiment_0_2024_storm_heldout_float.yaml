# Validation-only float processing for the frozen storm-day held-out stations.
# Do not include the model-day YAML: Ginan appends list-valued inputs across
# direct includes, which would contaminate this run with the ten model sites.
inputs:
  include_yamls:
    - Docs/stecCovarianceFeasibility/experiment_0_2024_common.yaml
  erp_files:
    - storm/products/WUM0MGXFIN_20241320000_01D_01D_ERP.ERP
  snx_files:
    - shared/products/tables/igs_satellite_metadata.snx
    - shared/products/tables/sat_yaw_bias_rate.snx
    - storm/products/AUT23136.SNX
  satellite_data:
    nav_files:
      - storm/products/BRDC00IGS_R_20241320000_01D_MN.rnx
    clk_files:
      - storm/products/WUM0MGXFIN_20241320000_01D_30S_CLK.CLK
    bsx_files:
      - storm/products/WUM0MGXFIN_20241320000_01D_01D_OSB.BIA
    sp3_files:
      - storm/products/WUM0MGXFIN_20241310000_01D_05M_ORB.SP3
      - storm/products/WUM0MGXFIN_20241320000_01D_05M_ORB.SP3
      - storm/products/WUM0MGXFIN_20241330000_01D_05M_ORB.SP3
    obx_files: []
  gnss_observations:
    rnx_inputs:
      - storm/data/STR200AUS_R_20241320000_01D_30S_MO.rnx
      - storm/data/BALL00AUS_S_20241320000_01D_30S_MO.rnx
      - storm/data/PARK00AUS_R_20241320000_01D_30S_MO.rnx

outputs:
  metadata:
    config_description: exp0_2024_storm_heldout_float_main_<HASH>

satellite_options:
  G01:
    exclude: true

processing_options:
  epoch_control:
    start_epoch: 2024-05-11 00:00:00
  gnss_general:
    sys_options:
      gps:
        ambiguity_resolution: false
  ambiguity_resolution:
    mode: OFF
