# Experimental guarded feedback with a 0.999 bootstrap success threshold.
# Ratio, canonical-windup and phase-OSB safety gates remain unchanged.
inputs:
  include_yamls:
    - Docs/stecCovarianceFeasibility/experiment_1_receiver_sd_ar.yaml

outputs:
  metadata:
    config_description: exp2e_2024_success_0999_subset_feedback

processing_options:
  ambiguity_resolution:
    success_rate_threshold: 0.999
    solution_ratio_threshold: 3
    integer_complement_diagnostics: true
    dual_frequency_subset_feedback: true
    canonicalize_phase_windup_integer: true

  epoch_control:
    max_epochs: 900
