# Matched FLOAT control for experiment 4c.
inputs:
  include_yamls:
    - /mnt/d/tec/code-exp5-sigma-20260909-v2/base_3mm.yaml

outputs:
  metadata:
    config_description: exp4d_2024_code_rapid_persistent_phase_osb_float_full_day

satellite_options:
  global:
    models:
      phase_bias:
        use_formal_sigma_as_observation_noise: false
        use_formal_sigma_as_state_prior: true

processing_options:
  ambiguity_resolution:
    integer_complement_diagnostics: true
    dual_frequency_subset_probe_only: true
    canonicalize_phase_windup_integer: true
  ppp_filter:
    chunking:
      by_receiver: false
      size: 0

estimation_parameters:
  satellites:
    global:
      phase_bias:
        estimated: [true]
        sigma: [1]
        process_noise: [0]
        outage_limit: [0]
