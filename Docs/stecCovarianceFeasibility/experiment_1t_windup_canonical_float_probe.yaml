# Restart-invariant phase-windup integer-gauge diagnostic.  Integer candidates
# remain probe-only and are not submitted to the filter.
inputs:
  include_yamls:
    - Docs/stecCovarianceFeasibility/experiment_1_receiver_sd_ar.yaml

outputs:
  metadata:
    config_description: exp1t_2024_windup_canonical_float_probe

processing_options:
  ambiguity_resolution:
    integer_complement_diagnostics: true
    dual_frequency_subset_probe_only: true
    canonicalize_phase_windup_integer: true

  epoch_control:
    max_epochs: 2880

