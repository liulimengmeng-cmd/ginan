# Matched FLOAT control for experiment 3e.
inputs:
  include_yamls:
    - Docs/stecCovarianceFeasibility/experiment_1_receiver_sd_ar.yaml

outputs:
  metadata:
    config_description: exp3f_2024_per_epoch_osb_no_chunk_float_full_day

processing_options:
  ambiguity_resolution:
    integer_complement_diagnostics: true
    dual_frequency_subset_probe_only: true
    canonicalize_phase_windup_integer: true

  epoch_control:
    max_epochs: 2880

  ppp_filter:
    chunking:
      by_receiver: false
      size: 0
